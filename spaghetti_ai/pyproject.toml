[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "spaghetti-ai"
version = "0.1.0"
description = "Read-only Guider 2S print-failure detection with Home Assistant notifications"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "numpy==2.1.3",
  "onnxruntime==1.20.1",
  "opencv-python-headless==4.10.0.84",
  "paho-mqtt==2.1.0",
  "requests==2.32.3",
]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
spaghetti-ai = "spaghetti_ai.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
